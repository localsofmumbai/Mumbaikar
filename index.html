<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mumbaikar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4A435">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mumbaikar">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #F4A435;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── Background map watermark ── */
.bg-map {
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 375px;
  height: 720px;
  pointer-events: none;
  z-index: 0;
}

/* ── Home screen ── */
.page {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  padding-top: calc(16px + env(safe-area-inset-top));
}
.menu-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex-shrink: 0;
}
.menu-btn span {
  display: block;
  width: 22px;
  height: 2.5px;
  background: #1A1A1A;
  border-radius: 2px;
}
.header-title {
  font-size: 20px;
  font-weight: 700;
  color: #1A1A1A;
  letter-spacing: -0.2px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.header-spacer { width: 34px; flex-shrink: 0; }

.content { padding: 24px 24px 0; flex: 1; }
.section-label {
  font-size: 17px;
  font-weight: 600;
  color: #1A1A1A;
  margin-bottom: 16px;
  text-align: center;
}
.map-card {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  text-decoration: none;
  display: block;
  box-shadow: 0 6px 24px rgba(0,0,0,0.13);
  transition: transform 0.15s;
  margin-bottom: 28px;
}
.map-card:active { transform: scale(0.98); }
.map-thumb {
  width: 100%;
  height: 210px;
  object-fit: cover;
  object-position: center bottom;
  display: block;
  background: #e8e8e8;
}
.map-card-footer {
  padding: 14px 18px 16px;
  text-align: center;
}
.map-info-name {
  font-size: 18px;
  font-weight: 500;
  color: #1A1A1A;
  letter-spacing: -0.2px;
  margin-bottom: 3px;
}
.map-info-category {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(26,26,26,0.38);
}
.footer {
  padding: 24px 20px 36px;
  padding-bottom: calc(36px + env(safe-area-inset-bottom));
  text-align: center;
}
.footer-logo { height: 22px; width: auto; opacity: 0.75; }

/* ── Full-screen menu ── */
.menu-screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
.menu-screen.open { transform: translateY(0); }

/* Red hero section */
.menu-hero {
  background: #CC1B2F;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 24px 28px;
  padding-top: calc(20px + env(safe-area-inset-top));
  position: relative;
  min-height: 260px;
}
.menu-close-btn {
  position: absolute;
  top: 20px;
  top: calc(20px + env(safe-area-inset-top));
  left: 20px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}
.menu-close-btn svg { width: 24px; height: 24px; }
.menu-hero-logo {
  width: 160px;
  height: 160px;
  position: relative;
  z-index: 1;
}

/* Cream/light nav section */
.menu-nav {
  background: #F5F0EC;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding-bottom: env(safe-area-inset-bottom);
}

/* Primary nav items */
.nav-primary {
  padding: 8px 0 4px;
}
.nav-primary-item {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px 24px;
  text-decoration: none;
  color: #111;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s;
}
.nav-primary-item:active { background: rgba(0,0,0,0.04); }
.nav-primary-icon {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-primary-icon img { width: 32px; height: 32px; }
.nav-primary-label {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.2px;
  line-height: 1.2;
}
.nav-chevron {
  color: #999;
  flex-shrink: 0;
}
.nav-chevron svg { width: 20px; height: 20px; }

.nav-divider { height: 1px; background: rgba(0,0,0,0.08); margin: 4px 24px; }

/* Secondary nav items */
.nav-secondary { padding: 8px 0 4px; }
.nav-secondary-item {
  display: block;
  padding: 10px 24px;
  text-decoration: none;
  color: #333;
  font-size: 16px;
  font-weight: 400;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s;
}
.nav-secondary-item:active { background: rgba(0,0,0,0.04); }

/* Menu footer */
.menu-footer {
  border-top: 1px solid rgba(0,0,0,0.08);
  padding: 20px 24px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.menu-footer-logo { height: 24px; width: auto; }
.menu-footer-sub {
  font-size: 12px;
  color: rgba(0,0,0,0.35);
}
</style>
</head>
<body>

<!-- Home screen background -->
<img src="icons/screen-map.svg" class="bg-map" alt="" aria-hidden="true">

<!-- Full-screen menu -->
<div class="menu-screen" id="menuScreen">
  <div class="menu-hero">
    <button class="menu-close-btn" onclick="closeMenu()" aria-label="Close menu">
      <!-- Close icon -->
      <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
    <img src="icons/lovemumbai-circle.svg" class="menu-hero-logo" alt="Love Mumbai">
  </div>

  <div class="menu-nav">
    <div class="nav-primary">
      <a href="map.html?map=hybrid" class="nav-primary-item">
        <div class="nav-primary-icon"><img src="icons/nav-map.svg" alt=""></div>
        <span class="nav-primary-label">Browse Map</span>
        <span class="nav-chevron"><svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 20 20"><path d="M7 4l6 6-6 6"/></svg></span>
      </a>
      <a href="lines.html" class="nav-primary-item">
        <div class="nav-primary-icon"><img src="icons/nav-suburban.svg" alt=""></div>
        <span class="nav-primary-label">Mumbai Suburban lines</span>
        <span class="nav-chevron"><svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 20 20"><path d="M7 4l6 6-6 6"/></svg></span>
      </a>
      <a href="ticket.html" class="nav-primary-item">
        <div class="nav-primary-icon"><img src="icons/nav-ticket.svg" alt=""></div>
        <span class="nav-primary-label">Ticketing System</span>
        <span class="nav-chevron"><svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 20 20"><path d="M7 4l6 6-6 6"/></svg></span>
      </a>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-secondary">
      <a href="about.html" class="nav-secondary-item">About</a>
      <button class="nav-secondary-item" onclick="shareApp()">Share this App</button>
      <a href="mailto:contact@localsofmumbai.com" class="nav-secondary-item">Feedback</a>
      <a href="tos.html" class="nav-secondary-item">Terms and Conditions</a>
    </div>

    <div style="flex:1"></div>

    <div class="menu-footer">
      <img src="icons/LOM-ID.svg" class="menu-footer-logo" alt="Locals of Mumbai">
      <span class="menu-footer-sub">Explore More at localsofmumbai.com</span>
    </div>
  </div>
</div>

<!-- Home page -->
<div class="page">
  <div class="header">
    <button class="menu-btn" onclick="openMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <span class="header-title">Mumbaikar</span>
    <div class="header-spacer"></div>
  </div>

  <div class="content">
    <div class="section-label">Maps</div>

    <a href="map.html?map=hybrid" class="map-card">
      <img src="icons/thumb-hybrid.png" class="map-thumb" alt="Mumbai Transit Map" loading="eager">
      <div class="map-card-footer">
        <div class="map-info-name">Mumbai transit map</div>
        <div class="map-info-category">Hybrid</div>
      </div>
    </a>

    <a href="map.html?map=curve" class="map-card">
      <img src="icons/thumb-curve.png" class="map-thumb" alt="Mumbai Transit Map — Curve" loading="eager">
      <div class="map-card-footer">
        <div class="map-info-name">Mumbai transit map — Curve</div>
        <div class="map-info-category">Stylised</div>
      </div>
    </a>
  </div>

  <div class="footer">
    <img src="icons/LOM-ID.svg" class="footer-logo" alt="Locals of Mumbai">
  </div>
</div>

<script>
function openMenu() {
  document.getElementById('menuScreen').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMenu() {
  document.getElementById('menuScreen').classList.remove('open');
  document.body.style.overflow = '';
}
function shareApp() {
  closeMenu();
  if (navigator.share) {
    navigator.share({
      title: 'Mumbaikar',
      text: 'Mumbai Transit Map — All lines, all stations. Free.',
      url: 'https://mumbaikar.localsofmumbai.com'
    });
  }
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
